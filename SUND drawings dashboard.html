<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SUND BIRSTA — Parts &amp; Drawings</title>
<style>
:root{
  --bg:#0B2531;--panel:#0F3040;--bezel:#0A2430;--bezel-2:#123A4D;--bezel-3:#081E28;
  --ink:#E7EDF3;--ink-2:#AAB6C2;--ink-3:#7E8B97;--ink-4:#586470;
  --line:#25485B;--amber:#F2A20C;--amber-deep:#E7AB33;--amber-tint:#2A2310;
  --steel:#6E97B5;--steel-2:#87A8C1;--steel-tint:#173442;--green:#38A76C;--red:#DB6462;
  --mono:Arial,Helvetica,sans-serif;--sans:Arial,Helvetica,sans-serif;--r:6px;
  --sh:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.app{max-width:1500px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{background:var(--bezel);padding:14px 20px 12px;position:sticky;top:0;z-index:30}
.hd{display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:11px}
.mark{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.13em;color:var(--amber);border:1px solid rgba(242,162,12,.45);padding:3px 7px;border-radius:4px;white-space:nowrap}
h1{font-size:15.5px;font-weight:600;margin:0;letter-spacing:-.01em}
.stamp{font-family:var(--mono);font-size:10.5px;color:#7B8896;margin-top:2px}
.stamp b{color:var(--amber);font-weight:500}
.console{background:var(--bezel-2);padding:13px 20px 14px;display:flex;flex-direction:column;gap:11px;position:sticky;top:60px;z-index:25}
.row{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.grp{display:flex;flex-direction:column;gap:5px;min-width:0}
.lab{font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:#5F6C7A}
.seg{display:inline-flex;background:var(--bezel-3);border:1px solid #234455;border-radius:5px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{font-family:var(--mono);font-size:11.5px;color:#96A3B1;background:transparent;border:0;padding:7px 12px;border-radius:3px;cursor:pointer;text-transform:uppercase;transition:.13s;white-space:nowrap}
.seg button:hover{color:#DDE4EB}
.seg button.on{background:var(--amber);color:#140E00;font-weight:600}
.sbox{position:relative;flex:1;min-width:230px}
.sbox input{width:100%;font-family:var(--mono);font-size:15px;padding:13px 40px 13px 38px;border-radius:6px;border:1px solid #234455;background:var(--bezel-3);color:#F0F5F9}
.sbox input::placeholder{color:#525E6B}
.sbox input:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(242,162,12,.2)}
.sbox .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#525E6B;font-size:14px;pointer-events:none}
select{font-family:var(--mono);font-size:12.5px;padding:9px 11px;border-radius:5px;border:1px solid #234455;background:var(--bezel-3);color:#DDE4EB;max-width:320px}
.chk{display:inline-flex;align-items:center;gap:7px;color:#A6B2BF;font-size:12px;cursor:pointer;font-family:var(--mono)}
.chk input{accent-color:var(--amber);width:15px;height:15px}
.res{padding:0 20px 30px}
.bar{display:flex;justify-content:space-between;align-items:center;padding:12px 2px 8px;color:var(--ink-3);font-size:12px;font-family:var(--mono)}
.bar b{color:var(--amber)}
table{width:100%;border-collapse:collapse}
thead th{position:sticky;top:132px;background:var(--bezel);z-index:5;text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:#7B8896;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th.n,td.n{text-align:right}
tbody td{padding:9px 10px;border-bottom:1px solid var(--line-2,#173540);font-size:13px;vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover{background:#0E2E3D}
.sund-code{font-family:var(--mono);font-weight:700;color:#fff}
.mono{font-family:var(--mono)}.dim{color:var(--ink-3)}
.asmdesc{font-family:var(--sans);font-size:11px;color:var(--ink-2);margin-top:2px;max-width:180px;white-space:normal;line-height:1.3}
.txt{color:var(--ink-2);max-width:260px}
.mcode{font-family:var(--mono);color:var(--steel-2)}
.ty{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:1px 6px;border-radius:3px;border:1px solid var(--line)}
.cat-s{color:var(--green)}.cat-w{color:var(--amber-deep)}.cat-c{color:var(--steel-2)}
.stk{font-family:var(--mono);font-weight:700}.stk.p{color:var(--green)}.stk.z{color:var(--ink-4)}
.none{color:var(--ink-4)}
.dwg-link{display:inline-flex;align-items:center;gap:3px;margin-top:5px;text-decoration:none;font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--amber);border:1px solid rgba(242,162,12,.4);border-radius:4px;padding:1px 6px;width:max-content}
.dwg-link:hover{background:var(--amber);color:#140E00}
.dwg-link.assy{color:var(--steel-2);border-color:#2E5468}
.dwg-link.assy:hover{background:var(--steel-2);color:#08222e}
.more{display:block;margin:16px auto;background:var(--panel);border:1px solid var(--line);color:var(--amber);font-family:var(--mono);padding:10px 18px;border-radius:6px;cursor:pointer}
.state{padding:60px 20px;text-align:center;color:var(--ink-3)}
.credit{color:var(--ink-4);font-size:11px;text-align:center;padding:16px}
.credit b{color:var(--amber-deep);font-weight:600}
/* dossier / drawing viewer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.dos{position:fixed;top:0;right:0;height:100%;width:min(1280px,97vw);background:var(--bg);border-left:1px solid var(--line);box-shadow:var(--sh);transform:translateX(100%);transition:.24s;z-index:41;display:flex;flex-direction:column}
.dos.on{transform:none}
.dos-h{background:var(--bezel);padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dos-h .c{font-family:var(--mono);font-weight:700;color:var(--amber);font-size:15px}
.dos-h .d{color:var(--ink-2);font-size:12.5px;margin-top:3px}
.x{background:var(--bezel-3);border:1px solid #2A4B5D;color:#96A3B1;border-radius:5px;font-size:19px;line-height:1;padding:5px 11px;cursor:pointer}
.x:hover{background:var(--amber);color:#0E1114}
.dos-tabs{display:flex;gap:6px;padding:10px 18px 0;background:var(--bezel);flex-wrap:wrap}
.dtab{font-family:var(--mono);font-size:11.5px;color:#96A3B1;background:var(--bezel-3);border:1px solid #234455;border-bottom:0;border-radius:7px 7px 0 0;padding:8px 14px;cursor:pointer}
.dtab.on{color:var(--amber);background:var(--bg);border-color:var(--line)}
.dtab.none{opacity:.4;cursor:default}
.dos-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.dos-meta .kv{background:var(--panel);padding:6px 11px}
.dos-meta .k{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.dos-meta .v{font-size:13px;margin-top:2px}
.viewer{flex:1;background:#1b1b1b;position:relative;min-height:70vh}
.viewer iframe{width:100%;height:100%;border:0}
.viewer .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8a8a8a;font-family:var(--mono);font-size:13px;text-align:center;padding:20px}
.vbar{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:var(--bezel);border-top:1px solid var(--line)}
.vbar a{font-family:var(--mono);font-size:12px;color:var(--amber);text-decoration:none;border:1px solid rgba(242,162,12,.4);border-radius:5px;padding:6px 12px}
.vbar a:hover{background:var(--amber);color:#140E00}
.vbar .fn{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
@media(max-width:640px){thead th{top:0}}
</style>
</head>

</div>

<div class="scrim" id="scrim"></div>

</aside>

<script>
(function(){
  var D=JSON.parse(document.getElementById('sund').textContent);
  var SD=JSON.parse(document.getElementById('sunddraw').textContent);
  var C={}; D.cols.forEach(function(c,i){C[c]=i;});
  var ROWS=D.rows;
  var norm=function(s){return (s||'').toUpperCase().replace(/\s+/g,'');};
  var CODEDESC={}; // SUND code -> its own part description (used to describe an assembly by its code)
  D.rows.forEach(function(r){var k=norm(r[C['SUND Code']]); if(k&&!(k in CODEDESC))CODEDESC[k]=r[C['Description']];});
  function asmDesc(code){var d=CODEDESC[norm(code)];return d||'';}
  function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  var DRAWDIR='SUND drawings';                       // folder (next to this file) holding the PDFs
  try{var _sv=localStorage.getItem('sund_drawdir'); if(_sv)DRAWDIR=_sv;}catch(e){}
  // relative URL -> the browser resolves it against THIS file's own location,
  // so moving the dashboard + folder together (any drive/path) keeps links working.
  function hrefS(p){return encodeURI(DRAWDIR.replace(/[\\/]+$/,'')+'/'+p);}
  function hl(s,t){if(!t)return esc(s);var i=(''+s).toLowerCase().indexOf(t);if(i<0)return esc(s);return esc(s.slice(0,i))+'<mark style="background:rgba(242,162,12,.32);color:#fff">'+esc(s.slice(i,i+t.length))+'</mark>'+esc(s.slice(i+t.length));}
  document.getElementById('n').textContent=ROWS.length.toLocaleString();
  // equipment dropdown
  (function(){var m={};ROWS.forEach(function(r){var e=r[C['Equipment']];if(e&&!m[e])m[e]=r[C['Machine']];});
    var sel=document.getElementById('equip');Object.keys(m).sort().forEach(function(e){var o=document.createElement('option');o.value=e;o.textContent=e+' — '+m[e];sel.appendChild(o);});})();

  var q=document.getElementById('q'),tbl=document.getElementById('tbl'),cnt=document.getElementById('cnt'),moreb=document.getElementById('more');
  var mode='code',equip='',cat='',fdraw=false,PAGE=100,shown=PAGE,cur=ROWS;
  var iCODE=C['SUND Code'],iDESC=C['Description'],iEQ=C['Equipment'],iMACH=C['Machine'],iASM=C['Assembly'],iPOS=C['Pos'],iTYPE=C['Type'],iCAT=C['Category'],iQTY=C['Qty'],iAQS=C['AQS Code'],iUR=C['UR'];

  function hasD(r){return SD[norm(r[iCODE])]||SD[norm(r[iASM])];}
  function match(r,t){
    if(mode==='code')return (''+r[iCODE]).toLowerCase().indexOf(t)>=0;
    if(mode==='equip')return ((''+r[iEQ]+' '+r[iMACH]).toLowerCase()).indexOf(t)>=0;
    if(mode==='asm')return (''+r[iASM]).toLowerCase().indexOf(t)>=0;
    if(mode==='aqs')return (''+r[iAQS]).toLowerCase().indexOf(t)>=0;
    return (r.join(' ').toLowerCase()).indexOf(t)>=0;
  }
  function run(){
    var t=q.value.trim().toLowerCase();
    cur=ROWS.filter(function(r){
      if(equip&&r[iEQ]!==equip)return false;
      if(cat&&r[iCAT]!==cat)return false;
      if(fdraw&&!hasD(r))return false;
      if(t&&!match(r,t))return false;
      return true;
    });
    shown=PAGE;paint(t);
  }
  function catCls(c){return c==='Spare'?'cat-s':c==='Wear'?'cat-w':'cat-c';}
  function tyCls(ty){var f=(ty||'').charAt(0);return f==='S'?'cat-s':f==='W'?'cat-w':'cat-c';}
  function paint(t){
    cnt.innerHTML='<b>'+cur.length.toLocaleString()+'</b> item'+(cur.length===1?'':'s');
    if(!cur.length){tbl.innerHTML='<div class="state">No SUND item matches “'+esc(q.value)+'”.</div>';moreb.style.display='none';return;}
    var sl=cur.slice(0,shown);
    var head='<thead><tr><th>SUND code</th><th>Description</th><th>Equipment</th><th>Machine</th><th>Assembly</th><th class="n">Pos</th><th>Type</th><th>Cat.</th><th class="n">Qty</th><th>AQS</th><th class="n">Stock</th></tr></thead>';
    var body=sl.map(function(r,idx){
      var i=ROWS.indexOf(r);
      var own=SD[norm(r[iCODE])], asm=SD[norm(r[iASM])];
      var dl = own&&own.length?'<br><a class="dwg-link" href="'+hrefS(own[0].pdf)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">▨ DWG'+(own.length>1?' ×'+own.length:'')+'</a>':'';
      var al = (asm&&asm.length&&norm(r[iASM])!==norm(r[iCODE]))?'<br><a class="dwg-link assy" href="'+hrefS(asm[0].pdf)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">▨ ASSY'+(asm.length>1?' ×'+asm.length:'')+'</a>':'';
      var ur=r[iUR]; var stk = ur===''||ur==null?'<span class="none">—</span>':'<span class="stk '+(+ur>0?'p':'z')+'">'+(+ur).toLocaleString()+'</span>';
      return '<tr data-i="'+i+'"><td><span class="sund-code">'+hl(r[iCODE],t)+'</span>'+dl+'</td>'
        +'<td class="txt">'+hl(r[iDESC],t)+'</td>'
        +'<td class="mono dim">'+hl(r[iEQ],t)+'</td>'
        +'<td class="dim">'+esc(r[iMACH])+'</td>'
        +'<td class="mono dim">'+hl(r[iASM],t)+(asmDesc(r[iASM])?'<div class="asmdesc">'+hl(asmDesc(r[iASM]),t)+'</div>':'')+al+'</td>'
        +'<td class="n mono dim">'+esc(r[iPOS])+'</td>'
        +'<td>'+(r[iTYPE]?'<span class="ty '+tyCls(r[iTYPE])+'">'+esc(r[iTYPE])+'</span>':'<span class="none">—</span>')+'</td>'
        +'<td class="mono '+catCls(r[iCAT])+'">'+esc(r[iCAT])+'</td>'
        +'<td class="n mono">'+esc(r[iQTY])+'</td>'
        +'<td>'+(r[iAQS]?'<span class="mcode">'+hl(r[iAQS],t)+'</span>':'<span class="none">—</span>')+'</td>'
        +'<td class="n">'+stk+'</td></tr>';
    }).join('');
    tbl.innerHTML='<table>'+head+'<tbody>'+body+'</tbody></table>';
    moreb.style.display=cur.length>shown?'block':'none';
    moreb.textContent='Show '+Math.min(PAGE,cur.length-shown)+' more · '+(cur.length-shown).toLocaleString()+' remaining';
  }
  q.addEventListener('input',run);
  document.getElementById('modes').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;mode=b.dataset.m;[].forEach.call(this.children,function(x){x.classList.toggle('on',x===b);});
    q.placeholder={code:'Type a SUND code…',equip:'Equipment number or machine…',asm:'Type an assembly code…',aqs:'AQS material code…',all:'Search every field…'}[mode];run();});
  document.getElementById('cats').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;cat=b.dataset.c;[].forEach.call(this.children,function(x){x.classList.toggle('on',x===b);});run();});
  document.getElementById('equip').addEventListener('change',function(){equip=this.value;run();});
  document.getElementById('fdraw').addEventListener('change',function(){fdraw=this.checked;run();});
  var dirin=document.getElementById('dirin'); if(dirin){dirin.value=DRAWDIR;
    dirin.addEventListener('change',function(){DRAWDIR=(this.value.trim()||'SUND drawings');try{localStorage.setItem('sund_drawdir',DRAWDIR);}catch(e){}
      paint(q.value.trim().toLowerCase());});}
  moreb.addEventListener('click',function(){shown+=PAGE;paint(q.value.trim().toLowerCase());});

  // ----- drawing viewer (dossier) -----
  var dos=document.getElementById('dos'),scrim=document.getElementById('scrim'),viewer=document.getElementById('viewer'),
      dtabs=document.getElementById('dtabs'),dfn=document.getElementById('dfn'),dopen=document.getElementById('dopen');
  function closeDos(){dos.classList.remove('on');scrim.classList.remove('on');viewer.innerHTML='<div class="empty">No drawing on file for this item.</div>';}
  document.getElementById('dx').onclick=closeDos;scrim.onclick=closeDos;
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDos();});
  var sheets=[];
  function showSheet(k){
    [].forEach.call(dtabs.children,function(b){b.classList.toggle('on',b.dataset.k===k);});
    var s=sheets.filter(function(x){return x.k===k;})[0]; if(!s){viewer.innerHTML='<div class="empty">No drawing.</div>';dopen.style.display='none';dfn.textContent='';return;}
    viewer.innerHTML='<iframe src="'+hrefS(s.pdf)+'#toolbar=1&navpanes=0" title="drawing"></iframe>';
    dfn.textContent=s.pdf; dopen.href=hrefS(s.pdf); dopen.style.display='';
  }
  function openDos(i){
    var r=ROWS[i];
    document.getElementById('dcode').textContent=r[iCODE];
    document.getElementById('ddesc').textContent=r[iDESC];
    var meta=[['Equipment',r[iEQ]],['Machine',r[iMACH]],['Assembly',r[iASM]+(asmDesc(r[iASM])?' — '+asmDesc(r[iASM]):'')],['Pos',r[iPOS]],['Type',r[iTYPE]||'—'],['Category',r[iCAT]],['Qty',r[iQTY]],['AQS material',r[iAQS]||'—'],['On hand',(r[iUR]===''||r[iUR]==null)?'—':r[iUR]]];
    document.getElementById('dmeta').innerHTML=meta.map(function(kv){return '<div class="kv"><div class="k">'+esc(kv[0])+'</div><div class="v">'+esc(kv[1])+'</div></div>';}).join('');
    // build sheet list: item drawings then assembly drawings
    sheets=[];
    var own=SD[norm(r[iCODE])]||[], asm=(norm(r[iASM])!==norm(r[iCODE])?SD[norm(r[iASM])]:null)||[];
    own.forEach(function(x,n){sheets.push({k:'i'+n,pdf:x.pdf,label:'Item'+(own.length>1?' '+(n+1):'')+(x.rev?' · '+x.rev:'')});});
    asm.forEach(function(x,n){sheets.push({k:'a'+n,pdf:x.pdf,label:'Assembly'+(asm.length>1?' '+(n+1):'')+(x.rev?' · '+x.rev:'')});});
    if(!sheets.length){dtabs.innerHTML='<div class="dtab none">No drawing on file</div>';viewer.innerHTML='<div class="empty">No drawing on file for this item — try its assembly, or check the SUND drawings folder.</div>';dfn.textContent='';dopen.style.display='none';}
    else{dtabs.innerHTML=sheets.map(function(s){return '<div class="dtab" data-k="'+s.k+'">'+esc(s.label)+'</div>';}).join('');
      [].forEach.call(dtabs.children,function(b){b.onclick=function(){showSheet(b.dataset.k);};});
      showSheet(sheets[0].k);}
    dos.classList.add('on');scrim.classList.add('on');
  }
  tbl.addEventListener('click',function(e){var tr=e.target.closest('tr[data-i]');if(!tr)return;openDos(+tr.dataset.i);});
  run();
})();
</script>
